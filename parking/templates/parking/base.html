<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parking Simulator{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-start: #667eea;
            --bg-mid: #764ba2;
            --bg-accent: #f093fb;
            --bg-accent2: #4facfe;
            --bg-end: #00f2fe;
            --text-color: #333;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --panel-border: rgba(255, 255, 255, 0.3);
            --header-bg: rgba(0, 0, 0, 0.6);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --input-border: #e0e0e0;
            --muted: #555;
            --badge-bg: rgba(255, 255, 255, 0.2);
            --toggle-bg: rgba(255, 255, 255, 0.15);
        }
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 25%, var(--bg-accent) 50%, var(--bg-accent2) 75%, var(--bg-end) 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            color: var(--text-color);
            position: relative;
        }
        body.dark {
            background: linear-gradient(135deg, #0b1120 0%, #141b36 25%, #1c294b 50%, #19263f 75%, #0f1323 100%);
            color: #e8ecff;
        }
        body.dark .container {
            background: rgba(15, 18, 34, 0.92);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        body.dark .header {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.85), rgba(30, 37, 72, 0.5));
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }
        body.dark .button {
            color: white;
        }
        body.dark .search-input,
        body.dark input, body.dark select {
            background: rgba(20, 24, 46, 0.95);
            border-color: #3b4e7d;
            color: #ecf0ff;
        }
        body.dark .search-input:focus,
        body.dark input:focus, body.dark select:focus {
            border-color: #8a9eff;
            box-shadow: 0 0 0 3px rgba(138, 158, 255, 0.15);
        }
        body.dark .stat-card,
        body.dark .parking-space,
        body.dark .modal-content,
        body.dark .container {
            border-color: rgba(255,255,255,0.08);
        }
        body.dark .badge,
        body.dark .time,
        body.dark .theme-toggle {
            background: rgba(255, 255, 255, 0.08);
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><g fill="none" fill-rule="evenodd"><g fill="%23ffffff" fill-opacity="0.05"><path d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/></g></g></svg>');
            pointer-events: none;
            z-index: 0;
        }
        .header {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.6), rgba(102, 126, 234, 0.4));
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(12px);
            border-bottom: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }
        .header h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .time {
            font-size: 14px;
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .time span {
            display: block;
            line-height: 1.2;
        }
        .theme-toggle {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: white;
            padding: 10px 18px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .theme-toggle:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.24);
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .button.secondary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }
        .button.secondary:hover {
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }
        .button.warning {
            background: linear-gradient(135deg, #FF9800 0%, #f093fb 100%);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }
        .button.warning:hover {
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.6);
        }
        .button.danger {
            background: linear-gradient(135deg, #F44336 0%, #e74c3c 100%);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }
        .button.danger:hover {
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.6);
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }
        li:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        form {
            max-width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .actions {
            margin-top: 20px;
            text-align: center;
        }
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 300px;
            text-align: center;
            border-radius: 8px;
        }
        .modal-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .modal-button:hover {
            background-color: #45a049;
        }
        /* Statistics Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0 30px 0;
        }
        .quick-stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .quick-stat {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            padding: 18px 20px;
            color: white;
            backdrop-filter: blur(15px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .quick-stat:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
        }
        .quick-stat strong {
            font-size: 1.5em;
        }
        .quick-stat span {
            opacity: 0.9;
            font-size: 0.95em;
        }
        .quick-stat .indicator {
            display: inline-flex;
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.7);
            margin-right: 12px;
        }
        .indicator.free { background: #4CAF50; }
        .indicator.occupied { background: #F44336; }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }
        .stat-card.free {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .stat-card.occupied {
            background: linear-gradient(135deg, #F44336 0%, #e74c3c 100%);
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        /* Search Bar */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        /* Parking grid */
        .parking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .parking-space {
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .parking-space::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .parking-space:hover::before {
            left: 100%;
        }
        .parking-space.free {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border-color: #00d4ff;
        }
        .parking-space.occupied {
            background: linear-gradient(135deg, #F44336 0%, #e74c3c 100%);
            color: white;
            border-color: #d32f2f;
        }
        .parking-space:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        .parking-space .space-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .status-dot {
            display: inline-flex;
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.8);
        }
        .status-dot.free { background: #4CAF50; }
        .status-dot.occupied { background: #F44336; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="time" id="current-time"></div>
            <button class="theme-toggle" id="themeToggle" type="button"><i class="fas fa-moon"></i> Dark Mode</button>
        </div>
        <h1>Parking Simulator</h1>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <!-- Welcome Modal -->
    <div id="welcomeModal" class="modal">
        <div class="modal-content">
            <h2>Welcome to Parking Simulator</h2>
            <p>Click Enter to proceed.</p>
            <button class="modal-button" onclick="enterApp()">Enter</button>
        </div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            const timeContainer = document.getElementById('current-time');
            if (timeContainer) {
                timeContainer.innerHTML = `<span><i class="fas fa-clock"></i> ${timeString}</span><span><i class="fas fa-calendar-alt"></i> ${dateString}</span>`;
            }
        }

        function applyTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                toggle.innerHTML = theme === 'dark' ? '<i class="fas fa-sun"></i> Light Mode' : '<i class="fas fa-moon"></i> Dark Mode';
            }
        }

        function toggleTheme() {
            const current = localStorage.getItem('theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            applyTheme(next);
        }

        function filterParkingSpaces() {
            const searchInput = document.getElementById('searchInput');
            if (!searchInput) return;
            const filter = searchInput.value.toLowerCase();
            const spaces = document.querySelectorAll('.parking-space');
            spaces.forEach(space => {
                const text = space.textContent.toLowerCase();
                space.style.display = text.includes(filter) ? '' : 'none';
            });
        }

        function updateThemeAndTime() {
            const storedTheme = localStorage.getItem('theme') || 'light';
            applyTheme(storedTheme);
            updateTime();
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateThemeAndTime();
            setInterval(updateTime, 1000);
            if (!localStorage.getItem('welcomeShown')) {
                document.getElementById('welcomeModal').style.display = 'block';
            }
        });

        function enterApp() {
            document.getElementById('welcomeModal').style.display = 'none';
            localStorage.setItem('welcomeShown', 'true');
        }

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
