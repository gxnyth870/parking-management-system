services:
  - type: web
    name: parking-web
    runtime: python3
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn parking_web.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: parking-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          type: postgresql
          name: parking-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: True
      - key: SESSION_COOKIE_SECURE
        value: True
      - key: CSRF_COOKIE_SECURE
        value: True

databases:
  - type: postgresql
    name: parking-db
    ipAllowList: []